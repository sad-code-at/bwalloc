[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwalloc"
version = "0.1.0"
description = "Context-conditional, cost-aware bandwidth allocation from sparse operator traces"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
deep = ["torch>=2.0"]
foundation = ["chronos-forecasting", "timesfm"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
